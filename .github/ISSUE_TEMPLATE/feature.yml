name: Feature proposal
description: Propose a scoped improvement to communication, presence, discovery, messaging, or leases.
title: "[Proposal]: "
labels: ["proposal", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What observed workflow problem does this solve?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: How often does it happen, and how is it handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, privacy, and product-boundary impact
    validations:
      required: true
