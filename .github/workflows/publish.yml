name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:acceptance
      - run: npm run pack:verify
      - run: npm run pack:check
      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!==('v'+p.version))process.exit(1)"
      - name: Select npm dist-tag
        id: dist-tag
        run: node -e "const fs=require('node:fs');const p=require('./package.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag='+(p.version.includes('-')?'next':'latest')+'\n')"
      - run: npm publish --access public --provenance --tag ${{ steps.dist-tag.outputs.tag }}
