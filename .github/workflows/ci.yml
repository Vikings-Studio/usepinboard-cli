name: CI

# Runs only when flagged, to save Actions minutes:
#   - pull request labelled `ci` (or `release`)
#   - manual: Actions -> CI -> Run workflow
# Plain pushes and unlabelled pull requests start no jobs.
# Checks run on Linux; tick "full_matrix" on a manual run for macOS + Windows.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Also run on macOS and Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ ((github.event.action == 'labeled' && github.event.label.name != 'ci' && github.event.label.name != 'release') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]') && !contains(github.event.head_commit.message, '[deploy]'))) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[deploy]'))) ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release')) && (github.event.action != 'labeled' || github.event.label.name == 'ci' || github.event.label.name == 'release'))
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full_matrix && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: [24.15.0, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - run: npm run pack:verify

  package-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[deploy]'))) ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release')) && (github.event.action != 'labeled' || github.event.label.name == 'ci' || github.event.label.name == 'release'))
    name: Packed CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - run: npm run build
      - run: npm pack
      - run: npm install --global ./usepinboard-cli-*.tgz
      - run: PINBOARD_HOME="$RUNNER_TEMP/pinboard" pinboard init --dry-run
      - run: PINBOARD_HOME="$RUNNER_TEMP/pinboard" pinboard --version
