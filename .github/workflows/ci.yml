name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24.15.0, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - run: npm run pack:verify

  package-smoke:
    name: Packed CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - run: npm run build
      - run: npm pack
      - run: npm install --global ./usepinboard-cli-*.tgz
      - run: PINBOARD_HOME="$RUNNER_TEMP/pinboard" pinboard init --dry-run
      - run: PINBOARD_HOME="$RUNNER_TEMP/pinboard" pinboard --version
